<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IOC 3.0 An Bình (Copy) (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room shell. Fixed top scope bar, left screen index (IOC-01…20), scrolling work area. Dark-first for video wall; light mirror for office desks. */
:root{
  color-scheme:dark;
  --bg:#091214; --s1:#0e1b1e; --s2:#132427; --s3:#1a3034; --line:#203840; --line2:#2b474e;
  --ink:#dce9ea; --muted:#8ca4a8; --faint:#5c7579;
  --accent:#3fc1bf; --accent-ink:#03201f;
  --ok:#3db67c; --warn:#e2a23c; --crit:#ee5a50; --info:#619ff0; --ai:#a891f3; --stale:#8a989b;
  --scene:#0b1517; --grass:#14231f; --slab:#24363a; --corr:#2e4246; --wall:#bfcfcd; --furn:#5d7471;
  --f-num:"Barlow Semi Condensed","Be Vietnam Pro",system-ui,sans-serif;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#eef3f3; --s1:#ffffff; --s2:#f5f8f8; --s3:#e7eeef; --line:#d4e0e1; --line2:#c2d2d4;
  --ink:#0f272a; --muted:#53706f; --faint:#8aa1a2;
  --accent:#0a7f7d; --accent-ink:#ffffff;
  --ok:#1d8752; --warn:#b5720a; --crit:#c8372e; --info:#2e6ccc; --ai:#6a4ed0; --stale:#6f7f82;
  --scene:#dde7e6; --grass:#c9dbc8; --slab:#d3dedc; --corr:#edf2f1; --wall:#fbfdfc; --furn:#c0cdca;}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef3f3; --s1:#ffffff; --s2:#f5f8f8; --s3:#e7eeef; --line:#d4e0e1; --line2:#c2d2d4;
  --ink:#0f272a; --muted:#53706f; --faint:#8aa1a2;
  --accent:#0a7f7d; --accent-ink:#ffffff;
  --ok:#1d8752; --warn:#b5720a; --crit:#c8372e; --info:#2e6ccc; --ai:#6a4ed0; --stale:#6f7f82;
  --scene:#dde7e6; --grass:#c9dbc8; --slab:#d3dedc; --corr:#edf2f1; --wall:#fbfdfc; --furn:#c0cdca;}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* shell */
.shell{height:100%;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:292px 1fr;grid-template-areas:"top top" "warn warn" "nav main"}
.top{grid-area:top;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--s1);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-num);font-size:19px;font-weight:700;letter-spacing:.02em}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.scope{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ctl select,.ctl input{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;min-width:0}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.clock b{color:var(--ink);font-weight:500}
.srcs{display:flex;gap:4px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:6px;background:var(--s2);border:1px solid var(--line)}
.role{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.role select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;max-width:210px}
.warnbar{grid-area:warn;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--warn) 14%,var(--s1));border-bottom:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:13px}
.warnbar b{color:var(--warn)}
nav.side{grid-area:nav;background:var(--s1);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 24px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.ng{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.ni{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 8px;cursor:pointer;color:var(--ink);font-size:13.5px}
.ni:hover{background:var(--s2)}
.ni[aria-current="page"]{background:var(--s3);box-shadow:inset 2px 0 0 var(--accent)}
.ni .c{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.ni .p{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--faint)}
.ni .p.p0{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ni .cnt{font-family:var(--f-mono);font-size:10.5px;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.ni[disabled]{opacity:.38;cursor:not-allowed}
main{grid-area:main;overflow:auto;min-width:0;position:relative}
.view{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start;max-width:1680px}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{margin:0;font-family:var(--f-num);font-weight:600;font-size:26px;letter-spacing:.01em;text-wrap:balance}
.vh .code{font-family:var(--f-mono);font-size:12px;color:var(--accent);display:block;margin-bottom:2px}
.vh .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{font-size:12.5px;color:var(--muted)} .crumb a{color:var(--accent);cursor:pointer;text-decoration:none}

/* primitives */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:14.5px;font-weight:600}
.ph .meta{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{padding:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-list{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line2);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{border-color:color-mix(in srgb,var(--crit) 55%,var(--line));color:var(--crit)}
.btn.ai{border-color:color-mix(in srgb,var(--ai) 55%,var(--line));color:var(--ai)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--muted)) 16%,transparent);color:var(--c,var(--muted))}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{--c:var(--ok)} .warn{--c:var(--warn)} .crit{--c:var(--crit)} .info{--c:var(--info)} .aic{--c:var(--ai)} .stale{--c:var(--stale)} .acc{--c:var(--accent)} .mut{--c:var(--muted)}
.d{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 11px;font-size:12.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--s2)}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line2);padding:2px 0 2px 10px}
textarea,.inp{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:13px;resize:vertical}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:11px 12px 9px;display:grid;gap:4px;text-align:left;cursor:pointer;position:relative;min-width:0}
.tile:hover{border-color:var(--line2);background:var(--s2)}
.tile .lb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:space-between}
.tile .kind{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.tile .v{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.tile .v b{font-family:var(--f-num);font-size:31px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--muted)}
.tile .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tile .dl{font-size:12px;font-weight:600}
.tile .ft{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.tile .ft{white-space:nowrap;overflow:hidden}
.tile .ft .i{margin-left:auto;border:0;background:none;color:var(--faint);cursor:pointer;font-family:var(--f-mono);font-size:10.5px;padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tile .ft .i:hover{color:var(--accent)}
.tile.sev-crit{box-shadow:inset 0 3px 0 var(--crit)} .tile.sev-warn{box-shadow:inset 0 3px 0 var(--warn)}
.tile.is-stale{background-image:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--stale) 9%,transparent) 8px 16px)}
.tile.is-stale .v b{color:var(--stale)}
.spark{display:block}

/* heat map */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hc{border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 11%,var(--s1));display:grid;gap:3px;min-width:0}
.hc:hover{background:color-mix(in srgb,var(--c) 20%,var(--s1))}
.hc b{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.hc span{font-size:11.5px;color:var(--muted)}
.hc.out{--c:var(--faint);opacity:.5;cursor:not-allowed}

/* flow */
.flow{display:grid;gap:9px}
.fr{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;font-size:13px}
.fr .st{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--s3)}
.fr .st i{display:block;height:100%}
.fr .q{text-align:right;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.fr.bn .nm{color:var(--crit);font-weight:600}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

/* alert list rows */
.al{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.al:hover{background:var(--s2)} .al[aria-current="true"]{background:var(--s3)}
.al:last-child{border-bottom:0}
.al .sv{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.al .t{font-weight:600;font-size:13.5px}
.al .s{font-size:12px;color:var(--muted)}
.al .r{display:grid;gap:4px;justify-items:end}

/* stepper */
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1 1 90px;min-width:90px;border-top:3px solid var(--s3);padding-top:6px;font-size:11.5px;color:var(--faint)}
.step b{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.step.done{border-color:color-mix(in srgb,var(--accent) 55%,var(--s3))} .step.done b{color:var(--ink)}
.step.cur{border-color:var(--accent)} .step.cur b{color:var(--accent)}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--s1);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.col h3{margin:0;font-size:12.5px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.col .cards{padding:8px;display:grid;gap:8px;align-content:start}
.card{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;font-size:12.5px}
.card .tt{font-weight:600;font-size:13px;line-height:1.35}
.card .mt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .ac{display:flex;gap:6px;flex-wrap:wrap}
.card.od{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}

/* report */
.rep{display:grid;gap:18px;max-width:880px}
.rep h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:baseline}
.rep h3 .mono{color:var(--faint)}
.rep p,.rep li{line-height:1.6;margin:0}
.rep ul{margin:0;padding-left:18px;display:grid;gap:4px}
.cite{font-family:var(--f-mono);font-size:10.5px;color:var(--ai);border:1px solid color-mix(in srgb,var(--ai) 35%,var(--line));border-radius:4px;padding:0 4px;white-space:nowrap;cursor:help}
.hyp{font-size:11px;font-weight:600;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 4px;margin-right:4px}
.flag{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:8px;padding:10px 12px;font-size:13px}
.tl{display:grid;gap:0}
.tl div{display:grid;grid-template-columns:96px 14px 1fr;gap:8px;font-size:12.5px;padding:5px 0}
.tl div i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line2);margin-top:4px;background:var(--s1)}
.tl div.done i{background:var(--accent);border-color:var(--accent)}
.tl div.cur i{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.tl .mono{color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;min-height:460px}
.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:12px;align-content:start;max-height:560px}
.m{max-width:92%;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.55}
.m.u{justify-self:end;background:var(--s3)}
.m.a{background:color-mix(in srgb,var(--ai) 9%,var(--s1));border:1px solid color-mix(in srgb,var(--ai) 28%,var(--line))}
.m.a.deny{background:color-mix(in srgb,var(--crit) 8%,var(--s1));border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.m .src2{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.sugg button{background:var(--s2);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.ask{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ask input{flex:1;min-width:0}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-size:13.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.tabs button .c{font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-right:6px}

/* bed board */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.bed{height:38px;border-radius:5px;font-family:var(--f-mono);font-size:10.5px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,var(--s2));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));color:var(--ink)}

/* map */
#mapView{height:100%}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;height:100%;min-height:560px}
.mapv{position:relative;background:var(--scene);min-height:520px;overflow:hidden;border-right:1px solid var(--line)}
.mapv canvas{display:block;width:100%;height:100%;touch-action:none}
.mlabels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11px;font-weight:600;background:var(--s1);color:var(--ink);border:1px solid var(--line2);padding:2px 7px 2px 6px;border-radius:6px;white-space:nowrap;display:flex;gap:5px;align-items:center}
.lbl.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.lbl.fl{background:transparent;border:0;font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.mtool{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.mtool>*{pointer-events:auto}
.mtool .seg,.mtool .btn{background:var(--s1)}
.mleg{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;right:12px}
.mleg .pill{background:var(--s1);border:1px solid var(--line)}
.mside{background:var(--s1);overflow:auto;display:grid;align-content:start}
.mside .sec{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.tip{position:absolute;pointer-events:none;font-size:12px;background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:6px;white-space:nowrap}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(3,10,12,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--s1);border:1px solid var(--line2);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;display:grid}
.modal .ph{position:sticky;top:0;background:var(--s1)}
.modal .pf{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line)}
dl.dict{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:0;font-size:13px}
dl.dict dt{color:var(--faint);font-size:12px}
dl.dict dd{margin:0}
.otp{display:flex;gap:6px}
.otp input{width:42px;height:46px;text-align:center;font-family:var(--f-mono);font-size:20px;background:var(--s2);border:1px solid var(--line2);border-radius:8px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:min(420px,calc(100% - 32px))}

/* video wall */
body.wall .shell{grid-template-columns:0 1fr}
body.wall nav.side{display:none}
body.wall .view{max-width:none;font-size:15px}
body.wall .tile .v b{font-size:38px}

@media (max-width:1180px){.g-main,.g-list{grid-template-columns:minmax(0,1fr)} .g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr;grid-template-areas:"top" "warn" "nav" "main"}
  nav.side{display:flex;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  nav.side .ng{display:none}
  .ni{grid-template-columns:auto auto;white-space:nowrap;width:auto}
  .ni .p{display:none}
  main{overflow:visible}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .live{margin-left:0}
  .mapwrap{grid-template-columns:1fr}
  .mapv{height:62vh;min-height:360px;border-right:0}
  .fr{grid-template-columns:96px 1fr;}
  .fr .q{grid-column:2;text-align:left}
  dl.dict{grid-template-columns:1fr}
}

/* ===== v2: control-room polish ===== */
:root{--shadow:0 1px 0 rgba(255,255,255,.035) inset,0 12px 30px -20px rgba(0,0,0,.75);--dotc:rgba(120,170,175,.09)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--shadow:0 1px 2px rgba(16,40,43,.05),0 10px 26px -18px rgba(16,40,43,.22);--dotc:rgba(16,60,64,.07)}}
:root[data-theme="light"]{--shadow:0 1px 2px rgba(16,40,43,.05),0 10px 26px -18px rgba(16,40,43,.22);--dotc:rgba(16,60,64,.07)}
main{background-image:radial-gradient(var(--dotc) 1px,transparent 1.2px);background-size:22px 22px}
.panel{box-shadow:var(--shadow)}
.ph{gap:10px}
.ph .tic{width:28px;height:28px}
.ph h2{font-size:14.5px;letter-spacing:.005em}
.tic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.tic svg{display:block}
/* tiles */
.tile{grid-template-rows:auto auto auto 1fr auto;padding:12px 13px 10px;gap:6px;box-shadow:var(--shadow)}
.tile .lb{justify-content:flex-start;gap:8px}
.tile .tl2{flex:1;min-width:0;line-height:1.3}
.tile .v b{font-size:34px}
.sparkw{display:block;width:100%;height:30px}
.sp0{height:30px}
.tile.sev-crit{box-shadow:inset 0 3px 0 var(--crit),var(--shadow)}
.tile.sev-warn{box-shadow:inset 0 3px 0 var(--warn),var(--shadow)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:18px 20px;align-items:center;background:linear-gradient(115deg,color-mix(in srgb,var(--c) 16%,var(--s1)) 0%,var(--s1) 58%);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.hero .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);font-weight:700;display:flex;gap:8px;align-items:center}
.hero h2{font-family:var(--f-num);font-size:30px;line-height:1.1;margin:6px 0 10px;font-weight:600;text-wrap:balance}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap}
.hero .chips button{border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 12%,var(--s1));color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.hero .meta2{margin-top:10px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.gauges{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.gauge{display:grid;justify-items:center;gap:3px;text-align:center;width:108px}
.gauge b{font-size:12px;font-weight:600;line-height:1.3}
.gauge span{font-size:11px;color:var(--muted)}
/* level chip */
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.lvl .d{background:currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* nav */
.ni{grid-template-columns:22px 1fr auto;gap:9px;padding:7px 9px}
.ni .c{color:var(--faint);display:grid;place-items:center}
.ni[aria-current="page"] .c{color:var(--accent)}
.ni .nm{min-width:0;line-height:1.3}
.ni .cd{display:block;font-family:var(--f-mono);font-size:10px;color:var(--faint);letter-spacing:.03em}
/* heat */
.hc{padding:10px 11px;gap:5px}
.hb{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 18%,var(--s3));overflow:hidden;margin-top:2px}
.hb i{display:block;height:100%;background:var(--c)}
/* chevron flow */
.chev{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.cv{position:relative;background:var(--s2);padding:12px 12px 12px 22px;display:grid;gap:2px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);min-width:0}
.cv:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:14px;border-radius:8px 0 0 8px}
.cv .sn{font-size:11.5px;color:var(--muted);line-height:1.3;min-height:30px}
.cv b{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1;color:var(--warn)}
.cv .ss{font-size:11px;color:var(--faint)}
.cv .sx{font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:4px}
.cv .mb{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--s3);margin-top:6px}
.cv .mb i{display:block;height:100%}
.cv.bn{background:color-mix(in srgb,var(--crit) 16%,var(--s2))}
.cv.bn b{color:var(--crit)}
.cv.bn .sn{color:var(--crit);font-weight:600}
/* alerts */
.al{grid-template-columns:30px 1fr auto}
.aic2{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.slab{height:3px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:6px;max-width:220px}
.slab i{display:block;height:100%;background:var(--c)}
/* stepper v2 */
.steps2{display:flex;min-width:560px}
.st2{flex:1;position:relative;text-align:center;font-size:11.5px;color:var(--faint);padding:0 2px}
.st2 .dt{width:24px;height:24px;border-radius:50%;margin:0 auto 6px;border:2px solid var(--line2);background:var(--s1);display:grid;place-items:center;position:relative;z-index:1;font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.st2:not(:last-child)::after{content:"";position:absolute;top:11px;left:calc(50% + 13px);right:calc(-50% + 13px);height:2px;background:var(--line2)}
.st2 b{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.3}
.st2.done .dt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st2.done::after{background:var(--accent)}
.st2.done b{color:var(--ink)}
.st2.cur .dt{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.st2.cur b{color:var(--accent)}
/* AI */
.aipanel{border-color:color-mix(in srgb,var(--ai) 38%,var(--line))}
.aipanel>.ph{background:linear-gradient(90deg,color-mix(in srgb,var(--ai) 12%,transparent),transparent 70%)}
.aipanel h2{color:var(--ai)}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:i}
.issues li{counter-increment:i;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--s2);cursor:pointer;font-size:13px;line-height:1.45}
.issues li:hover{background:var(--s3)}
.issues li::before{content:counter(i);width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--ai) 20%,transparent);color:var(--ai);font:600 11px var(--f-mono);display:grid;place-items:center}
/* kanban card */
.card{box-shadow:var(--shadow)}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.who i{width:20px;height:20px;border-radius:50%;background:var(--s3);font-style:normal;font-size:9.5px;font-weight:700;display:grid;place-items:center}
.duebar{height:3px;border-radius:2px;background:var(--s3);overflow:hidden}
.duebar i{display:block;height:100%;background:var(--c)}
/* topology */
.topo text{font-family:var(--f-ui)}
/* matrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx tr.me td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:12px;font-weight:700}
.ck.y{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.ck.n{color:var(--faint)}
@media (max-width:1180px){.hero{grid-template-columns:1fr}.gauges{justify-content:flex-start}}
@media (max-width:900px){
  .chev{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .cv,.cv:first-child{clip-path:none;border-radius:8px;padding-left:12px}
  .ni{grid-template-columns:18px auto}
  .ni .cd,.ni .cnt{display:none}
  .gauge{width:92px}
}


/* ===== Digital Twin map ===== */
.mcrumb{display:flex;align-items:center;gap:2px;background:var(--s1);border:1px solid var(--line2);border-radius:9px;padding:4px 6px;font-size:13px;box-shadow:var(--shadow);flex-wrap:wrap}
.mcrumb button{background:none;border:0;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--accent);display:inline-flex;gap:6px;align-items:center;font-weight:500}
.mcrumb button:hover{background:var(--s2)}
.mcrumb b{padding:4px 8px;font-weight:600}
.mcrumb .sep{color:var(--faint)}
.blbl{position:absolute;transform:translate(-50%,calc(-100% - 8px));display:flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:7px;background:#1f5f9e;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25)}
.blbl::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#1f5f9e;border-bottom:0}
.blbl .bd{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.blbl .acn{background:#ec5146;border-radius:9px;padding:0 6px;font:600 10.5px var(--f-mono);line-height:17px}
.mhint{position:absolute;right:12px;top:108px;font-size:11.5px;color:var(--muted);background:var(--s1);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
@media (max-width:900px){.mhint{display:none}}

/* ===== v4: xanh biển, phong cách hành chính – y tế ===== */
:root{--bg:#0b1422;--s1:#101b2d;--s2:#14223a;--s3:#1b2c47;--line:#223450;--line2:#2c4166;--ink:#e3eaf4;--muted:#93a3bb;--faint:#64748f;--accent:#4b8fe8;--accent-ink:#ffffff;--ok:#3fb27b;--warn:#e0a13c;--crit:#ea5a50;--info:#4fb0dc;--ai:#86a7dc;--stale:#8a96a6;--scene:#0b1525;--grass:#14231f;--slab:#24344a;--corr:#2d3f58;--wall:#c3cfdd;--furn:#5d6f86;--shadow:0 1px 2px rgba(0,0,0,.35);--dotc:transparent;color-scheme:dark;--f-num:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f2f5f9;--s1:#ffffff;--s2:#f6f8fb;--s3:#e8edf4;--line:#dae2ec;--line2:#c6d2e1;--ink:#14233a;--muted:#55657d;--faint:#8693a8;--accent:#1f5fbf;--accent-ink:#ffffff;--ok:#1d8752;--warn:#b5720a;--crit:#c8372e;--info:#1680b5;--ai:#3d5f99;--stale:#6f7c8c;--scene:#dfe7ef;--grass:#c9dbc8;--slab:#d6dee8;--corr:#edf1f6;--wall:#fbfcfe;--furn:#c0cbd8;--shadow:0 1px 2px rgba(20,35,58,.06);--dotc:transparent;color-scheme:light}}
:root[data-theme="light"]{--bg:#f2f5f9;--s1:#ffffff;--s2:#f6f8fb;--s3:#e8edf4;--line:#dae2ec;--line2:#c6d2e1;--ink:#14233a;--muted:#55657d;--faint:#8693a8;--accent:#1f5fbf;--accent-ink:#ffffff;--ok:#1d8752;--warn:#b5720a;--crit:#c8372e;--info:#1680b5;--ai:#3d5f99;--stale:#6f7c8c;--scene:#dfe7ef;--grass:#c9dbc8;--slab:#d6dee8;--corr:#edf1f6;--wall:#fbfcfe;--furn:#c0cbd8;--shadow:0 1px 2px rgba(20,35,58,.06);--dotc:transparent;color-scheme:light}
main{background-image:none}
.panel,.tile,.modal,.col,.card{border-radius:6px}
.btn,.seg,.ctl select,.ctl input,.role select,.inp,textarea{border-radius:5px}
.pill{border-radius:4px;font-weight:500;padding:2px 7px}
.tic{background:none;width:20px;height:20px}
.ph .tic{width:20px;height:20px}
.tile .kind{border:0;padding:0;color:var(--faint);font-size:10px;margin-left:auto}
.tile .lb{flex-wrap:wrap;align-items:flex-start;row-gap:2px}
.tile .tl2{flex:1 1 130px;font-size:12.5px;font-weight:500;color:var(--ink);text-wrap:balance}
.tile .lb .tic{margin-top:-1px}
.tile .ft{gap:8px}
.tile .ft .i{flex:0 1 auto}
.tile .v b{font-size:30px;font-weight:600;letter-spacing:-.01em}
.vh h1{font-size:22px;font-weight:700;letter-spacing:0}
.vh .code{color:var(--muted)}
.brand b{font-family:var(--f-ui);font-size:17px;letter-spacing:0}
.mark{border-radius:6px}
.hero{background:var(--s1);border-color:var(--line);border-top:3px solid var(--c)}
.hero .eyebrow{letter-spacing:.04em;text-transform:none;font-size:12.5px}
.hero .eyebrow .d{display:none}
.hero h2{font-family:var(--f-ui);font-size:21px;font-weight:700}
.hero .chips button{border-radius:4px;background:var(--s2);border-color:var(--line2)}
.lvl{border-radius:4px}
.lvl .d{animation:none}
.aipanel{border-color:var(--line)}
.aipanel>.ph{background:none}
.aipanel h2{color:var(--ink)}
.issues li::before{background:var(--s3);color:var(--ink)}
.hc{border-radius:5px}
.cv b{font-family:var(--f-ui);font-size:24px}
.cv:first-child{border-radius:5px 0 0 5px}
.gauge text{font-family:var(--f-ui)}
.ng{letter-spacing:.06em}
.ni{border-radius:5px}
.ni .cd{display:none}
.ni[aria-current="page"]{background:color-mix(in srgb,var(--accent) 10%,var(--s1));box-shadow:inset 3px 0 0 var(--accent)}
.ni[aria-current="page"] .nm{color:var(--accent);font-weight:600}
.mcrumb,.blbl{border-radius:5px}
.cite{border-radius:3px}

/* ===== giường ===== */
.g-beds{grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr)}
.bedtbl td:first-child{white-space:nowrap}
.beds2{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.bed2{display:grid;justify-items:center;gap:3px;padding:6px 4px 7px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 6%,var(--s1));border-radius:5px;cursor:pointer;min-width:0;color:var(--ink)}
.bed2:hover{background:color-mix(in srgb,var(--c) 14%,var(--s1))}
.bed2.on{outline:2px solid var(--accent);outline-offset:1px}
.bed2 .bh{display:flex;justify-content:space-between;width:100%;padding:0 3px;font-size:10.5px;color:var(--muted);align-items:center}
.bed2 .gh{font-size:9.5px;font-weight:700;color:var(--crit)}
.bed2 .bp{font-size:11px;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;padding:8px 10px;border:1px dashed var(--line2);border-radius:5px;margin-bottom:10px;color:var(--muted)}
.idbar.on{border-style:solid;border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--s1));color:var(--ink)}
.idbar span{flex:1 1 220px}
.beddet{margin-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.ptc{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--s2);font-size:13px}
.pti{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;color:var(--muted)}
@media (max-width:1180px){.g-beds{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== IOC-01 v2: bảng điều hành ===== */
.sech{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 -6px}
.sech b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sech span{font-size:12.5px}
.decs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.dec{background:var(--s1);border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-top:4px solid var(--c);border-radius:6px;padding:12px 14px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.dh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}.dh .pill{margin-left:auto}
.dm{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dbig{font-size:46px;font-weight:700;line-height:1;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dun{font-size:13px;color:var(--muted);margin-left:6px}
.dth{font-size:12px;color:var(--muted);margin-top:4px}
.dsp{flex:none}
.dwhy{margin:0;padding-left:16px;display:grid;gap:3px;font-size:12.5px;line-height:1.45}
.dwhy li::marker{color:var(--c)}
.dact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media (min-width:1500px){.kps{grid-template-columns:repeat(9,minmax(0,1fr))}}
.kp{display:grid;gap:5px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:10px 11px;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.kp:hover{background:var(--s2)}

  const p=a.map((v,i)=>[i/(a.length-1)*w,h-3-(v-mn)/r*(h-6)]);
  const d=p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("");
  const l=p[p.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d}L${w} ${h}L0 ${h}Z" fill="${c}" opacity=".13"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="2.6" fill="${c}"/></svg>`;
}

function opdChart(){
  const W=640,H=220,L=36,R=12,T=14,B=26,iw=W-L-R,ih=H-T-B,mx=100;
  const x=i=>L+i*(iw/(HOURS.length-1)), y=v=>T+ih-(v/mx)*ih;
  const line=(a,c,dash)=>`<path d="${a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("")}" fill="none" stroke="${c}" stroke-width="2"${dash?` stroke-dasharray="${dash}"`:""}/>`+a.map((v,i)=>i===a.length-1?`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${c}"/><text x="${x(i)-6}" y="${y(v)-8}" text-anchor="end" font-size="11" fill="${c}" font-weight="600">${v}′</text>`:"").join("");
  const amax=250, bw=iw/HOURS.length*0.5;
  let g="";
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${v}</text>`;});
  const bars=OPD.arr.map((v,i)=>`<rect x="${x(i)-bw/2}" y="${T+ih-(v/amax)*ih*0.55}" width="${bw}" height="${(v/amax)*ih*0.55}" fill="var(--s3)"/>`).join("");
  const thr=`<line x1="${L}" x2="${W-R}" y1="${y(45)}" y2="${y(45)}" stroke="var(--crit)" stroke-dasharray="4 4"/><text x="${L+4}" y="${y(45)-5}" font-size="10" fill="var(--crit)">Ngưỡng OPD-001 · 45′</text>`;
  const xl=HOURS.map((h,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${h}h</text>`).join("");
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Thời gian chờ khám P50 và P90 theo giờ">${g}${bars}${thr}${line(OPD.p90,"var(--warn)","5 3")}${line(OPD.p50,"var(--crit)")}${xl}</svg></div>

/* ---- người bệnh theo giường (dữ liệu mẫu, tên hư cấu) ---- */
const SHARED={NOI:3,NHI:2};
const PN={ho:["Nguyễn","Trần","Lê","Phạm","Hoàng","Huỳnh","Phan","Vũ","Võ","Đặng","Bùi","Đỗ","Hồ","Ngô","Dương","Lý"],
  dm:["Văn","Hữu","Đức","Minh","Quang","Thành","Công","Gia"],df:["Thị","Ngọc","Thu","Thanh","Kim","Mỹ","Bảo"],
  tm:["Hùng","Dũng","Tuấn","Nam","Long","Phúc","Khang","Sơn","Bình","Tài","Lộc","Hải","An","Trí"],tf:["Hoa","Lan","Mai","Hương","Thảo","Linh","Trang","Yến","Hạnh","Nga","Vy","Phương","Nhung","Hà"]};
const DX={NOI:["Viêm phổi cộng đồng","Đái tháo đường týp 2","Xuất huyết tiêu hóa","Đợt cấp COPD","Suy thận mạn"],TM:["Suy tim","Tăng huyết áp","Rung nhĩ","Hội chứng vành cấp"],NHI:["Viêm tiểu phế quản","Sốt xuất huyết","Tiêu chảy cấp","Viêm phổi"],SAN:["Theo dõi chuyển dạ","Hậu sản thường","Sau mổ lấy thai","Tiền sản giật"],NGOAI:["Sau mổ ruột thừa","Gãy xương đùi","Sỏi túi mật","Thoát vị bẹn"],ICU:["Sốc nhiễm khuẩn","Suy hô hấp","Sau mổ lớn"],HT:["Theo dõi sau gây mê"],ND:["Viêm dạ dày","Theo dõi sau phẫu thuật","Tăng huyết áp"],TMH:["Viêm amidan","Sau mổ đục thủy tinh thể"]};
const DOC={NOI:["BS. Hồ Văn Khải","BS. Đặng Thị Mai"],TM:["BS. Quách Văn Tài"],NHI:["BS. Kiều Anh Thư","BS. Đỗ Gia Bảo"],SAN:["BS. Mai Thanh Hương"],NGOAI:["BS. Phan Quang Vũ","BS. Tạ Hữu Lộc"],ICU:["BS. Lâm Quốc Bình"],HT:["BS. Châu Ngọc Hà"],ND:["BS. Trịnh Mỹ Linh"],TMH:["BS. La Thị Yến"]};
const _bedCache={};
const FLOOR_NO={NOI:2,TM:3,TMH:3,NHI:4,SAN:5,NGOAI:6,ND:7,ICU:2,HT:3};
function bedsOf(id){
  if(_bedCache[id]) return _bedCache[id];
  const d=DEPTS[id]; let seed=[...id].reduce((a,c)=>a*31+c.charCodeAt(0),7)%233280;
  const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const pick=a=>a[Math.floor(r()*a.length)];
  const sharedAt=new Set(); const ns=SHARED[id]||0; for(let k=0;k<ns;k++) sharedAt.add(Math.min(d.occ,3+k*Math.floor(d.occ/(ns+1))));
  const out=[];
  for(let i=1;i<=d.beds;i++){
    let st="occ"; if(i>d.occ) st=i<=d.occ+d.clean?"clean":"empty"; else if(i<=d.exp) st="dis";
    const pts=[];
    if(st==="occ"||st==="dis"){const n=sharedAt.has(i)?2:1;for(let k=0;k<n;k++){
      const f=id==="SAN"?true:r()<.5, ag=id==="NHI"?Math.floor(r()*14)+(r()<.3?0:1):id==="SAN"?20+Math.floor(r()*22):18+Math.floor(r()*72);
      const name=pick(PN.ho)+" "+(f?pick(PN.df):pick(PN.dm))+" "+(f?pick(PN.tf):pick(PN.tm));
      pts.push({ref:id+"-"+((seed*7+i*131+k*17)%65536).toString(16).toUpperCase().padStart(4,"0"),name,age:ag,sex:f?"Nữ":"Nam",days:1+Math.floor(r()*11),dx:pick(DX[id]||["Theo dõi"]),doc:pick(DOC[id]||["BS. trực khoa"]),dis:st==="dis"});
    }}
    out.push({i,st,pts,room:(FLOOR_NO[id]||2)*100+1+Math.floor((i-1)/3)});
  }
  if(MAINT[id]){const e=out.filter(b=>b.st==="empty").pop();if(e)e.st="maint";}
  return _bedCache[id]=out;
}

/* ============ IOC-14 Cảnh báo ============ */
function alertRow(a){
  const cs=a.caseId&&S.cases.find(c=>c.id===a.caseId);
  const c=SEV[a.sev][0];
  let sla="";
  if(cs&&cs.state!=="CLOSED"){const tot=cs.sla-cs.opened,used=Math.max(0,Math.min(1,(Date.now()-cs.opened)/tot));sla=`<div class="slab" title="SLA ${left(cs.sla)}" style="--c:var(--${used>=1?"crit":used>0.75?"warn":"accent"})"><i style="width:${used*100}%"></i></div>`;}
  return `<button class="al" data-alert="${a.id}" aria-current="${S.alertSel===a.id&&S.route==="ioc14"}"><span class="aic2" style="--c:var(--${a.state==="CLINICAL"?"ai":c})">${I(a.state==="CLINICAL"?"flask":a.state==="RESOLVED_FALSE_POSITIVE"?"shield":"alert",15)}</span><span style="min-width:0"><span class="t">${esc(a.title)}</span><br><span class="s">${DEPTS[a.dept].short} · <span class="mono">${a.rule}</span> · ${hm(a.t)}${a.dedup>1?` · gộp ${a.dedup} sự kiện`:""}${cs?` · ${cs.owner} · ${cs.state==="CLOSED"?"đã đóng":left(cs.sla)}`:""}</span>${sla}</span><span class="r">${pill(AL_ST[a.state][0],AL_ST[a.state][1],a.state)}${sevPill(a.sev)}</span></button>`;
}
function vIOC14(){
  const F={open:a=>["NEW","ACKNOWLEDGED","CLINICAL"].includes(a.state),all:()=>true,case:a=>a.state==="LINKED_TO_CASE",fp:a=>a.state==="RESOLVED_FALSE_POSITIVE"};
  const list=S.alerts.filter(a=>inScope(a.dept)).filter(F[S.alertFilter]).sort((a,b)=>b.sev-a.sev||b.t-a.t);
  let a=S.alerts.find(x=>x.id===S.alertSel&&inScope(x.dept)); if(!a) a=list[0];
  const cnt=k=>S.alerts.filter(x=>inScope(x.dept)).filter(F[k]).length;
  return vh("IOC-14 · F06","Trung tâm cảnh báo","Source Event → Validate → Rule → Alert → Case. Mọi bước có trạng thái và nhật ký, không “mất” cảnh báo.",
    `<div class="seg" role="group" aria-label="Lọc">${[["open","Đang mở"],["case","Đã tạo case"],["fp","Báo động giả"],["all","Tất cả"]].map(f=>`<button data-afilter="${f[0]}" aria-pressed="${S.alertFilter===f[0]}">${f[1]} · ${cnt(f[0])}</button>`).join("")}</div>`)+
  `<div class="grid g-list"><section class="panel">${list.length?list.map(alertRow).join(""):`<div class="empty">Không có cảnh báo ở bộ lọc này.</div>`}</section>
   <section class="panel">${a?alertDetail(a):`<div class="empty">Chọn một cảnh báo.</div>`}</section></div>`;
}
function alertDetail(a){
  const cs=a.caseId&&S.cases.find(c=>c.id===a.caseId);
  let acts="";
  if(a.state==="NEW") acts=`<button class="btn pri" data-act="ack" data-id="${a.id}">Xác nhận cảnh báo</button><button class="btn" data-act="fp" data-id="${a.id}">Đánh dấu báo động giả</button>`;
  else if(a.state==="ACKNOWLEDGED") acts=`<button class="btn pri" data-act="mkcase" data-id="${a.id}">Tạo case điều hành</button><button class="btn" data-act="fp" data-id="${a.id}">Đánh dấu báo động giả</button>`;
  else if(a.state==="LINKED_TO_CASE") acts=`<button class="btn" data-case="${a.caseId}">Mở ${a.caseId}</button>`;
  const payload={event_type:a.rule==="OPD-001"?"OPD_WAIT_THRESHOLD_EXCEEDED":a.rule.replace("-","_")+"_TRIGGERED",tenant_id:"hospital_A",source_system:a.src,occurred_at:new Date(a.t).toISOString(),rule_id:a.rule,data_quality:isStale(a.src)?"STALE":"VALID",source_version:172};
  return `<div class="ph"><h2>${esc(a.title)}</h2><div class="meta">${pill(AL_ST[a.state][0],AL_ST[a.state][1],a.state)}</div></div>
  <div class="pb" style="display:grid;gap:14px">
    ${a.state==="CLINICAL"?`<div class="flag" style="border-color:color-mix(in srgb,var(--ai) 45%,var(--line));background:color-mix(in srgb,var(--ai) 9%,transparent)"><b style="color:var(--ai)">Cảnh báo lâm sàng nguy cấp.</b> Thông báo theo quy trình chuyên môn ngay, không đợi workflow quản trị và không phụ thuộc AI. IOC chỉ giám sát thời điểm tiếp nhận và escalation.</div>
      <div class="tl">${a.clinical.map((c,i)=>`<div class="${i<a.clinical.length-1?"done":"cur"}"><span class="mono">${hm(c[0])}</span><i></i><span>${c[1]}</span></div>`).join("")}<div><span class="mono">—</span><i></i><span class="muted">Chờ nhân viên có thẩm quyền xác nhận đã nhận kết quả</span></div></div>`:""}
    <dl class="dict">
      <dt>Khoa</dt><dd>${DEPTS[a.dept].name}</dd>
      <dt>Quy tắc</dt><dd><span class="mono">${a.rule}</span> · ${esc(a.cond)}</dd>
      <dt>Giá trị ghi nhận</dt><dd>${esc(a.val)}</dd>
      <dt>Mức độ</dt><dd>${sevPill(a.sev)}</dd>
      <dt>Phát sinh</dt><dd class="mono">${hm(a.t)}${a.ack?` · xác nhận ${hm(a.ack)} (sau ${Math.round((a.ack-a.t)/MIN)} phút)`:""}</dd>
      ${a.sla&&a.state==="NEW"?`<dt>SLA xác nhận</dt><dd>${pill(a.sla<Date.now()?"crit":"warn",left(a.sla))} · quá SLA sẽ chuyển KHTH</dd>`:""}
      <dt>Hành động cấu hình</dt><dd>${esc(a.action)}</dd>
      ${a.reason?`<dt>Lý do đóng</dt><dd>${esc(a.reason)}</dd>`:""}
      ${cs?`<dt>Case liên kết</dt><dd><span class="mono">${cs.id}</span> · ${CS_ST[cs.state]} · ${cs.owner}</dd>`:""}
    </dl>
    ${acts?`<div style="display:flex;gap:8px;flex-wrap:wrap">${acts}</div>`:""}
    ${a.state!=="CLINICAL"&&a.state!=="LINKED_TO_CASE"&&a.state!=="RESOLVED_FALSE_POSITIVE"?`<textarea id="alNote" rows="2" placeholder="Ghi chú / lý do (bắt buộc khi đánh dấu báo động giả)"></textarea>`:""}
    <details><summary class="muted" style="cursor:pointer;font-size:12.5px">Sự kiện nguồn (không chứa danh tính người bệnh)</summary><pre class="mono" style="white-space:pre-wrap;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0;overflow-x:auto">${esc(JSON.stringify(payload,null,2))}</pre></details>
  </div>`;
}

function caseDetail(c){
  const can=S.role!=="cntt";
  let main="";
  const isGD=S.role==="gd";
  switch(c.state){
    case "OPEN":main=`<button class="btn pri" data-act="cs" data-to="TRIAGED" data-id="${c.id}">Phân loại & chọn chủ trì</button>`;break;
    case "TRIAGED":main=`<button class="btn pri" data-act="cs" data-to="PENDING_APPROVAL" data-id="${c.id}">Gửi phê duyệt</button><button class="btn" data-act="cs" data-to="ASSIGNED" data-id="${c.id}" ${c.sev<=1?"":"disabled title=\"Chỉ bỏ qua duyệt với loại việc đã cấu hình\""}>Giao trực tiếp</button>`;break;
    case "PENDING_APPROVAL":main=`<button class="btn pri" data-act="cs" data-to="ASSIGNED" data-id="${c.id}" ${isGD||S.role==="khth"||S.role==="pgd"?"":"disabled"}>Phê duyệt & giao việc</button><button class="btn" data-act="cs" data-to="TRIAGED" data-id="${c.id}">Trả lại</button>`;break;
    case "ASSIGNED":main=`<button class="btn pri" data-act="cs" data-to="IN_PROGRESS" data-id="${c.id}">Bắt đầu xử lý</button>`;break;

    case "WAIT_VERIFY":main=`<button class="btn pri" data-act="csclose" data-id="${c.id}">Xác minh & đóng case</button><button class="btn" data-act="cs" data-to="IN_PROGRESS" data-id="${c.id}">Chưa đạt, trả lại</button>`;break;
    case "CLOSED":main=`<button class="btn" data-act="csreopen" data-id="${c.id}">Mở lại case</button>`;break;
  }
  return `<div class="ph"><h2>${esc(c.title)}</h2><div class="meta"><span class="mono">${c.id}</span></div></div>
  <div class="pb" style="display:grid;gap:14px">
    ${stepper(CS_FLOW,CS_ST,c.state)}
    ${c.flags.length?`<div>${c.flags.map(f=>pill("warn",CS_ST[f],f)).join(" ")}</div>`:""}
    <dl class="dict">
      <dt>Chủ trì</dt><dd><b>${c.lead}</b> · người phụ trách ${c.owner}</dd>
      <dt>Phối hợp</dt><dd>${c.co.join(", ")}</dd>
      <dt>Người phê duyệt</dt><dd>${c.approver}</dd>
      <dt>SLA</dt><dd>${c.state==="CLOSED"?pill("ok","Đã đóng"):c.flags.includes("ON_HOLD")?pill("mut","SLA tạm dừng"):pill(c.sla<Date.now()?"crit":"warn",left(c.sla))} <span class="mono faint">hạn ${hm(c.sla)}</span></dd>
      <dt>Tiêu chí đóng</dt><dd>${esc(c.crit)}</dd>
      <dt>Cảnh báo gốc</dt><dd><a class="mono" data-alert="${c.alert}" style="color:var(--accent);cursor:pointer">${c.alert}</a></dd>
    </dl>
    ${can?`<textarea id="csNote" rows="2" placeholder="Ghi chú / bằng chứng (bắt buộc khi nộp kết quả, xác minh, mở lại)"></textarea>
    ${c.state==="WAIT_VERIFY"?`<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="csVerify"> Đã đo lại chỉ số sau xử lý và đạt tiêu chí đóng</label>`:""}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${main}
      ${c.state!=="CLOSED"?`<button class="btn" data-act="csflag" data-f="ON_HOLD" data-id="${c.id}">${c.flags.includes("ON_HOLD")?"Tiếp tục":"Tạm dừng"}</button><button class="btn dan" data-act="csflag" data-f="ESCALATED" data-id="${c.id}" ${c.flags.includes("ESCALATED")?"disabled":""}>Chuyển cấp</button>`:""}</div>`:""}
    <div><div class="muted" style="font-size:12px;margin-bottom:6px">NHẬT KÝ XỬ LÝ</div><div class="tl">${c.log.slice().reverse().map((l,i)=>`<div class="${i===0?"cur":"done"}"><span class="mono">${hm(l[0])}</span><i></i><span><b>${esc(l[1])}</b> · ${esc(l[2])}</span></div>`).join("")}</div></div>

/* ============ IOC-16 Nhiệm vụ ============ */
function taskActions(t){
  const mine=["gd","pgd","khth"].includes(S.role)||(["tk","nv"].includes(S.role)&&inScope(t.dept));
  if(!mine) return "";
  const b=(to,l,p)=>`<button class="btn sm${p?" pri":""}" data-act="tk" data-to="${to}" data-id="${t.id}">${l}</button>`;
  switch(t.state){
    case "DRAFT":return S.role==="gd"?b("ASSIGNED","Duyệt & giao",1)+b("CANCELLED","Hủy"):`<span class="faint" style="font-size:11.5px">Chờ Giám đốc duyệt</span>`;
    case "APPROVED":case "ASSIGNED":return b("ACCEPTED","Nhận việc",1)+b("REJECTED","Từ chối");
    case "ACCEPTED":return b("IN_PROGRESS","Bắt đầu",1);
    case "IN_PROGRESS":return b("SUBMITTED","Nộp kết quả",1);
    case "SUBMITTED":return ["tk","nv"].includes(S.role)?`<span class="faint" style="font-size:11.5px">Chờ KHTH xác minh</span>`:b("DONE","Xác minh & hoàn thành",1)+b("IN_PROGRESS","Trả lại");
    case "REJECTED":return !["tk","nv"].includes(S.role)?b("ASSIGNED","Giao lại",1):"";
  }
  return "";
}
function taskCard(t){
  const od=isOverdue(t);
  const ini=t.lead.replace(/^(Phòng|Khoa|Khối|Các)\s+/,"").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const span=Math.max(1,t.due-(t.created||NOW-6*60*MIN)),used=Math.max(0,Math.min(1,(Date.now()-(t.created||NOW-6*60*MIN))/span));
  const done=["DONE","VERIFIED"].includes(t.state);
  return `<div class="card${od?" od":""}" data-task="${t.id}" style="cursor:pointer"><div class="mt" style="justify-content:space-between"><span class="mono faint">${t.id}</span>${od?pill("crit","Quá hạn"):done?pill("ok","Xong"):`<span class="mono faint">${left(t.due)}</span>`}</div>
    <div class="tt">${esc(t.title)}</div>
    <div class="mt"><span class="who"><i>${ini}</i>${t.lead}</span></div>
    <div class="muted" style="font-size:12px">Phối hợp: ${t.co}</div>
    ${done?"":`<div class="duebar" style="--c:var(--${od?"crit":used>0.75?"warn":"accent"})"><i style="width:${(od?1:used)*100}%"></i></div>`}
    <div class="mt"><span class="pill mut">${TK_ST[t.state]}</span><span class="mono faint">hạn ${hm(t.due)}${t.due-NOW>86400000*0.6?" (ngày mai)":""}</span></div>
    <div class="faint" style="font-size:11.5px">Nguồn: ${t.src} · Tiêu chí: ${esc(t.crit)}</div>
    <div class="ac">${taskActions(t)}</div></div>`;
}
function taskRow(t){
  const od=isOverdue(t);
  return `<div class="al" data-task="${t.id}"><span class="sv" style="--c:var(${od?"--crit":"--line2"})"></span><span><span class="t">${esc(t.title)}</span><br><span class="s"><span class="mono">${t.id}</span> · ${t.lead} · hạn ${hm(t.due)} · ${t.src}</span><div class="ac" style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">${taskActions(t)}</div></span><span class="r"><span class="pill mut">${TK_ST[t.state]}</span>${od?pill("crit","Quá hạn"):""}</span></div>`;
}
function vIOC16(){
  const vis=S.tasks.filter(t=>inScope(t.dept)&&!(S.role==="nv"&&t.state==="DRAFT"));
  const cols=[["Dự thảo / chờ duyệt",["DRAFT"]],["Đã giao",["APPROVED","ASSIGNED","ACCEPTED","REJECTED"]],["Đang làm",["IN_PROGRESS"]],["Chờ xác minh",["SUBMITTED"]],["Hoàn thành",["VERIFIED","DONE"]]];
  const od=vis.filter(isOverdue).length;
  return vh("IOC-16 · F06","Nhiệm vụ & chỉ đạo",(S.role==="nv"?`Chỉ hiển thị nhiệm vụ được giao cho ${ROLES.nv.scope.split("·")[1].trim()} · `:"")+`DRAFT → APPROVED → ASSIGNED → ACCEPTED → IN_PROGRESS → SUBMITTED → VERIFIED → DONE · ${od} nhiệm vụ quá hạn`)+
  `<div class="kb">${cols.map(c=>{const it=vis.filter(t=>c[1].includes(t.state));return `<div class="col"><h3>${c[0]}<span class="mono faint">${it.length}</span></h3><div class="cards">${it.map(taskCard).join("")||`<div class="faint" style="font-size:12px;padding:8px">Trống</div>`}</div></div>`;}).join("")}</div>`;
}

  render();
  const m=document.querySelector(".msgs"); if(m) m.scrollTop=m.scrollHeight;
}

document.addEventListener("click",e=>{
  const t=e.target;
  if(!t.closest("#gSearchW")){const r=$("#gRes");if(r)r.hidden=true;}
  if(S.notifOpen&&!t.closest("#notifP")&&!t.closest("#bellBtn")){S.notifOpen=false;$("#notifP").hidden=true;}

  const EL=t.closest(NAVSEL); const pick=sel=>EL&&EL.matches(sel)?EL:null;
  if(pick("#bellBtn")){S.notifOpen=!S.notifOpen;renderTop();return;}
  const ng=pick("[data-ng]"); if(ng){const g=ng.dataset.ng;S.navOpen[g]=ng.getAttribute("aria-expanded")!=="true";renderNav();return;}
  const kq=pick("[data-kpi]"); if(kq&&kq.dataset.kpi){S.kpi=kq.dataset.kpi;go("S01-02");return;}
  const nd=pick("[data-node]"); if(nd){S.node=nd.dataset.node;go("S04-02");return;}
  const tq=pick("[data-task]"); if(tq&&tq.dataset.task){S.taskSel=tq.dataset.task;go("S22-03");return;}
  const jr=pick("[data-jour]"); if(jr){S.jourSel=jr.dataset.jour;S.jstep=jr.dataset.jstepv!=null?+jr.dataset.jstepv:null;go("S03-02");return;}

  const tri=pick("[data-triage]"); if(tri){S.triage=+tri.dataset.triage||null;S.route==="S06-02"?render():go("S06-02");return;}
  const pk=pick("[data-peak]"); if(pk){const v=+pk.dataset.peak;S.peakH=v<0?null:v;S.route==="S05-02"?render():go("S05-02");return;}

  const ic=pick("[data-inc]"); if(ic){S.incSel=ic.dataset.inc;S.route==="S11-02"?render():go("S11-02");return;}
  const em=pick("[data-emr]"); if(em){S.emrSel=em.dataset.emr;go("S12-03");return;}
  const fb=pick("[data-fb]"); if(fb){S.fbSel=fb.dataset.fb;go("S13-03");return;}
  const fo=pick("[data-fbod]"); if(fo){S.fbOd=fo.dataset.fbod==="1";render();return;}
  const eq=pick("[data-eq]"); if(eq){S.eqSel=eq.dataset.eq;go("S16-03");return;}

  const kr=pick("[data-krange]"); if(kr){S.kpiRange=kr.dataset.krange;render();return;}
  const fk=pick("[data-fk]"); if(fk){S.finKind=fk.dataset.fk;render();return;}
  if(pick("[data-aiprop]")){go("S23-03");return;}
  const mt=pick("[data-metric]"); if(mt){e.stopPropagation();openMetric(mt.dataset.metric);return;}
  const dp=pick("[data-dept]"); if(dp){ const id=dp.dataset.dept; if(!inScope(id)){toast("Khoa này nằm ngoài phạm vi quyền.");return;} if(ROLES[S.role].dept){if(ACCESS[S.role]("dept"))go("dept");return;} S.dept=id;S.deptTab="tong";go("dept");return;}
  const al=pick("[data-alert]"); if(al){S.alertSel=al.dataset.alert; go("S21-02");return;}
  const cs=pick("[data-case]"); if(cs){S.caseSel=cs.dataset.case;const a=S.alerts.find(x=>x.caseId===cs.dataset.case);if(a)S.alertSel=a.id;go("S21-02");return;}
  const bd0=pick("[data-beddept][data-go]"); if(bd0){S.bedDept=bd0.dataset.beddept;S.bedSel=null;go("ioc05");return;}
  const gt=pick("[data-go]"); if(gt&&gt.dataset.go){go(gt.dataset.go);return;}
